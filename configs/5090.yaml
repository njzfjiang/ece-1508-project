# Formal RTX 5090 profile. Keep experiment semantics aligned with base.yaml
# while using Blackwell-compatible dependencies and isolated output roots.

data:
  root: "data/processed"
  image_size: 512

training:
  model: "stabilityai/sd-turbo"
  resolution: 512
  batch_size: 1
  num_workers: 4
  learning_rate: 1.0e-5
  max_train_steps: 2000
  checkpointing_steps: 2000
  mixed_precision: "no"
  enable_xformers: false
  gradient_checkpointing: false
  viz_freq: 25
  eval_freq: 100
  num_samples_eval: 100

pix2pix_turbo:
  output_dir: "outputs/full_grid_5090/pix2pix_turbo/train"
  tracker_project_name: "pix2pix_turbo_darkdriving_5090"
  lora_rank_unet: 8
  lora_rank_vae: 4
  lambda_l2: 1.0
  lambda_lpips: 5.0
  lambda_clipsim: 5.0
  lambda_gan: 0.5
  train_image_prep: "resized_crop_512"
  test_image_prep: "resize_512x512"
  track_val_fid: false

cyclegan_turbo:
  output_dir: "outputs/full_grid_5090/cyclegan_turbo/train"
  tracker_project_name: "cyclegan_turbo_darkdriving_5090"
  batch_size: 1
  num_workers: 0
  checkpointing_steps: 2000
  preview_steps: 0
  mixed_precision: "fp16"
  gradient_checkpointing: true
  lora_rank_unet: 4
  lora_rank_vae: 4
  lambda_cycle: 1.0
  lambda_cycle_lpips: 10.0
  lambda_identity: 1.0
  lambda_identity_lpips: 1.0
  lambda_gan: 0.5
  train_image_prep: "resize_512x512"
  val_image_prep: "resize_512x512"
  validation_steps: 500
  validation_num_images: 1
  skip_training_validation: true
  allow_tf32: false

lora_rank_experiment:
  output_dir: "outputs/5090/lora_rank_experiment"
  shots: 10
  seed: 1
  steps: 1000
  resolution: 512
  precision: "fp16"
  unet_ranks: [4, 128]
  vae_rank: 4
  learning_rate: 5.0e-6
  batch_size: 1
  num_workers: 0
  checkpointing_steps: 1000
  preview_steps: 1000
  validation_samples: 100
  metrics: ["ssim", "lpips", "clip_similarity", "cmmd"]
  cmmd_sigma: 1.0
  enable_xformers: false
  gradient_checkpointing: true

eval:
  metrics: ["ssim", "lpips", "clip_similarity", "cmmd"]
  test_root: "data/processed/test"
  generated_dir: "results/full_grid_5090/generated"
  output_dir: "results/full_grid_5090/evaluation"
  checkpoint_roots:
    pix2pix: "${pix2pix_turbo.output_dir}"
    cyclegan: "${cyclegan_turbo.output_dir}"
  clip_model: "ViT-B/32"
  lpips_backbone: "alex"
  test_samples: 200
  cmmd_sigma: 1.0
