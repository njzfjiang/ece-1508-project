# Base configuration for experiments

# configs/base.yaml
# Base configuration for all experiments

# Dataset
data:
  root: "data/processed"
  img2img_turbo_root: "data/processed/img2img_turbo"
  dataset_name: "DarkDriving"
  image_size: 512
  batch_size: 4
  num_workers: 4
  shot_levels: [10, 20, 50]
  num_seeds: 3
  val_split: 0.1

# Model - SD-Turbo backbone
model:
  backbone: "stabilityai/sd-turbo"
  dtype: "fp16"  # fp16 or fp32
  enable_xformers: true

# Training - shared
training:
  num_epochs: 50
  max_train_steps: null  # set an integer to cap every run by optimizer steps
  learning_rate: 1e-4
  lr_scheduler: "constant"
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  mixed_precision: "fp16"
  save_every: 500
  eval_every: 200

# Training - pix2pix-turbo (paired / SD-Turbo+LoRA)
pix2pix_turbo:
  lora_rank_unet: 8
  lora_rank_vae: 4
  lambda_l2: 1.0
  lambda_lpips: 5.0
  lambda_clipsim: 5.0
  lambda_gan: 0.5
  train_image_prep: "resized_crop_512"
  test_image_prep: "resized_crop_512"

# Training - CycleGAN-Turbo (unpaired)
cyclegan_turbo:
  lora_rank_unet: 4
  lora_rank_vae: 4
  lambda_cycle: 1.0
  lambda_cycle_lpips: 10.0
  lambda_identity: 1.0
  lambda_identity_lpips: 1.0
  lambda_gan: 0.5
  train_image_prep: "resize_512x512"
  val_image_prep: "resize_512x512"

# Evaluation
eval:
  metrics: ["ssim", "lpips", "clip_similarity"]
  clip_model: "ViT-B/32"
  lpips_backbone: "alex"  # or "vgg"
  test_samples: 200
  breaking_point_alpha: 0.05

# Logging
logging:
  use_wandb: false  # set to true if you have wandb account
  log_dir: "results/logs"
  checkpoint_dir: "results/checkpoints"
  figure_dir: "results/figures"
