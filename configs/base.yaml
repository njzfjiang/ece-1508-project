# Base configuration for experiments

# configs/base.yaml
# Base configuration for all experiments

# Dataset
data:
  root: "data/processed"
  image_size: 512
  batch_size: 4
  num_workers: 4

training:
  model: "stabilityai/sd-turbo"
  resolution: 512
  batch_size: 4
  viz_freq: 25 # frequency of visualization during training

# Training - pix2pix-turbo (paired / SD-Turbo+LoRA)
pix2pix_turbo:
  lora_rank_unet: 8
  lora_rank_vae: 4
  lambda_l2: 1.0
  lambda_lpips: 5.0
  lambda_clipsim: 5.0
  lambda_gan: 0.5
  train_image_prep: "resized_crop_512"
  test_image_prep: "resized_crop_512"

# Training - CycleGAN-Turbo (unpaired)
cyclegan_turbo:
  lora_rank_unet: 4
  lora_rank_vae: 4
  lambda_cycle: 1.0
  lambda_cycle_lpips: 10.0
  lambda_identity: 1.0
  lambda_identity_lpips: 1.0
  lambda_gan: 0.5
  train_image_prep: "resize_512x512"
  val_image_prep: "resize_512x512"

# Evaluation
eval:
  metrics: ["ssim", "lpips", "clip_similarity", "cmmd"]
  output_dir: "results/evaluation"
  clip_model: "ViT-B/32"
  lpips_backbone: "alex"  # or "vgg"
  test_samples: 200
  breaking_point_alpha: 0.05
  bootstrap_iterations: 1000
  variance_ratio_min: 1.25

# Logging
logging:
  use_wandb: false  # set to true if you have wandb account
  log_dir: "results/logs"
  checkpoint_dir: "results/checkpoints"
  figure_dir: "results/figures"
