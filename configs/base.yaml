# Base configuration for experiments

# configs/base.yaml
# Base configuration for all experiments

# Dataset
data:
  root: "data/processed"
  image_size: 512

training:
  model: "stabilityai/sd-turbo"
  resolution: 512
  batch_size: 4
  num_workers: 4
  learning_rate: 5.0e-6
  max_train_steps: 10000
  checkpointing_steps: 500
  mixed_precision: "no"  # switch to fp16 only after applying the FP16 patch
  enable_xformers: true
  gradient_checkpointing: false
  viz_freq: 25
  eval_freq: 100
  num_samples_eval: 100

# Training - pix2pix-turbo (paired / SD-Turbo+LoRA)
pix2pix_turbo:
  output_dir: "outputs/pix2pix_turbo/train"
  tracker_project_name: "pix2pix_turbo_darkdriving"
  lora_rank_unet: 8
  lora_rank_vae: 4
  lambda_l2: 1.0
  lambda_lpips: 5.0
  lambda_clipsim: 5.0
  lambda_gan: 0.5
  train_image_prep: "resized_crop_512"
  test_image_prep: "resized_crop_512"
  track_val_fid: false

# Training - CycleGAN-Turbo (unpaired)
cyclegan_turbo:
  output_dir: "outputs/cyclegan_turbo/train"
  tracker_project_name: "cyclegan_turbo_darkdriving"
  lora_rank_unet: 4
  lora_rank_vae: 4
  lambda_cycle: 1.0
  lambda_cycle_lpips: 10.0
  lambda_identity: 1.0
  lambda_identity_lpips: 1.0
  lambda_gan: 0.5
  train_image_prep: "resize_512x512"
  val_image_prep: "resize_512x512"

# Evaluation
eval:
  metrics: ["ssim", "lpips", "clip_similarity", "cmmd"]
  test_root: "data/processed/test"
  output_dir: "results/evaluation"
  checkpoint_roots:
    pix2pix: "${pix2pix_turbo.output_dir}"
    cyclegan: "${cyclegan_turbo.output_dir}"
  clip_model: "ViT-B/32"
  lpips_backbone: "alex"  # or "vgg"
  test_samples: 200
  cmmd_sigma: 1.0

# Logging
logging:
  use_wandb: false  # set to true if you have wandb account
  log_dir: "results/logs"
  checkpoint_dir: "results/checkpoints"
  figure_dir: "results/figures"
