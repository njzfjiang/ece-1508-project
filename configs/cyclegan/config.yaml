# CycleGAN configuration

model:
  type: "cyclegan"
  pretrained: false
  generator:
    in_channels: 3
    out_channels: 3
    num_residual_blocks: 9
  discriminator:
    in_channels: 3
    num_filters: 64

training:
  batch_size: 4
  num_epochs: 200
  learning_rate: 0.0002
  beta1: 0.5
  beta2: 0.999
  lambda_cycle: 10.0
  lambda_identity: 0.5

data:
  image_size: 256
  num_workers: 4

# CycleGAN specific settings
cyclegan:
  pool_size: 50
  image_history_enabled: true
