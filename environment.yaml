name: ece-1508

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pip>=23
  - setuptools<81

  # PyTorch stack
  - pytorch=2.0.1
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - pytorch-cuda=11.8

  # System libs
  - mkl<2024
  - intel-openmp

  - pip:
      - -r requirements.txt
