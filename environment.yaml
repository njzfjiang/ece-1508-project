  - pip
  - pip:
    - PyYAML>=6.0
    - Pillow>=9.5.0
    - scikit-image>=0.20.0
    - seaborn>=0.12.2
    - plotly>=5.14.0
    - pandas>=2.0.2
    - scikit-learn>=1.2.2
    - tensorboard>=2.13.0
    - wandb>=0.15.0
    - black>=23.3.0
    - flake8>=6.0.0
    - pytest>=7.3.1
